<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.7">
<title>آجیل عید | در حال ساخت</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    color:#b30000;
    overflow:hidden;
}

/* پس‌زمینه */
.bg{
    position:absolute;
    width:200%;
    height:200%;
    background: repeating-linear-gradient(
        45deg,
        #b30000,
        #b30000 20px,
        #ffffff 20px,
        #ffffff 40px
    );
    opacity:0.07;
    animation:move 12s linear infinite;
}

@keyframes move{
    0%{transform:translate(0,0);}
    100%{transform:translate(-200px,-200px);}
}

/* کارت */
.box{
    position:relative;
    background:white;
    border:4px solid #b30000;
    padding:35px;
    border-radius:20px;
    text-align:center;
    width:520px;
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    animation:pop 0.8s ease;
}

@keyframes pop{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
}

/* نشان */
.badge{
    display:inline-block;
    background:#b30000;
    color:white;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:10px;
}

/* عنوان */
h1{
    margin:10px 0;
    font-size:26px;
}

/* هشدار */
.warning{
    font-size:17px;
    font-weight:500;
    margin:10px 0;
}

/* متن */
p{
    color:#444;
    font-size:15px;
    line-height:1.8;
}

/* خط چشمک */
.line{
    height:3px;
    background:#b30000;
    margin:15px 0;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.2;}
}

/* نوار پیشرفت */
.progress{
    width:100%;
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0;
}

.progress-bar{
    width:70%;
    height:100%;
    background:#b30000;
    animation:load 2s ease;
}

@keyframes load{
    from{width:0;}
    to{width:70%;}
}

/* شمارش معکوس */
.timer{
    font-size:18px;
    margin:10px 0;
    font-weight:bold;
}

/* فرم */
input{
    width:80%;
    padding:10px;
    border:2px solid #b30000;
    border-radius:10px;
    margin-top:10px;
    outline:none;
}

.notify{
    margin-top:10px;
    background:#b30000;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
}

/* بازگشت */
.back{
    margin-top:15px;
    background:#b30000;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="box">

    <div class="badge">⚠ در حال ساخت</div>

    <h1>جشنواره آجیل عید نوروز</h1>

    <div class="warning">🚧 این بخش هنوز آماده نیست 🚧</div>

    <div class="line"></div>

    <p>
        در حال آماده‌سازی بزرگ‌ترین جشنواره آجیل تازه نوروزی هستیم.<br>
        تجربه‌ای متفاوت از کیفیت، تازگی و قیمت ویژه به‌زودی آغاز می‌شود.
    </p>

    <!-- شمارش معکوس -->
    <div class="timer" id="countdown">در حال محاسبه زمان...</div>

    <!-- نوار پیشرفت -->
    <div class="progress">
        <div class="progress-bar"></div>
    </div>


    <button class="back" onclick="window.location.href='index.html'">
        بازگشت به صفحه اصلی
    </button>

</div>

<script>
// شمارش معکوس تا یک تاریخ فرضی (مثلاً 1 فروردین)
let target = new Date("2027-03-21").getTime();

let x = setInterval(function(){
    let now = new Date().getTime();
    let distance = target - now;

    let days = Math.floor(distance / (1000 * 60 * 60 * 24));
    let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        "⏳ تا افتتاح: " + days + " روز " + hours + " ساعت " + minutes + " دقیقه " + seconds + " ثانیه";

    if(distance < 0){
        clearInterval(x);
        document.getElementById("countdown").innerHTML = "🎉 جشنواره آغاز شد!";
    }
},1000);
</script>

</body>
</html>
