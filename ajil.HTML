<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9">
<title>در حال ساخت - جشنواره آجیل نوروز</title>

<!-- فونت بهتر -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',Tahoma,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#b71c1c,#ffffff);
    padding:20px;
}

/* کارت اصلی */
.container{
    width:100%;
    max-width:720px;
    background:#fff;
    border-radius:22px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    border:3px solid #b71c1c;
}

/* آیکن هشدار */
.icon{
    font-size:55px;
    animation:shake 1.5s infinite;
}

@keyframes shake{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(-5deg);}
    50%{transform:rotate(5deg);}
    75%{transform:rotate(-5deg);}
    100%{transform:rotate(0deg);}
}

.title{
    font-size:34px;
    font-weight:700;
    color:#b71c1c;
    margin-top:10px;
}

.subtitle{
    font-size:18px;
    color:#555;
    margin-top:10px;
    line-height:2;
}

.badge{
    display:inline-block;
    margin-top:15px;
    background:#b71c1c;
    color:#fff;
    padding:8px 18px;
    border-radius:50px;
    font-size:14px;
}

.status{
    margin-top:25px;
    font-size:20px;
    font-weight:500;
    color:#444;
}

.countdown{
    margin-top:20px;
    background:#fff0f0;
    border:2px dashed #b71c1c;
    padding:18px;
    border-radius:16px;
    font-size:20px;
    color:#b71c1c;
    font-weight:700;
}

/* دکمه */
.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 30px;
    background:#b71c1c;
    color:#fff;
    text-decoration:none;
    border-radius:12px;
    font-size:16px;
    transition:.3s;
}

.btn:hover{
    background:#7f0000;
    transform:translateY(-3px);
}

/* موبایل */
@media(max-width:600px){
    .title{
        font-size:26px;
    }
    .countdown{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">🚧</div>

    <div class="badge">در حال ساخت</div>

    <div class="title">جشنواره آجیل عید نوروز</div>

    <div class="subtitle">
        این بخش هنوز در حال آماده‌سازی است.<br>
        به‌زودی تجربه‌ای متفاوت از خرید آجیل تازه و باکیفیت نوروزی آغاز خواهد شد.
    </div>

    <div class="status">⏳ در حال آماده‌سازی...</div>

    <div class="countdown" id="countdown">در حال محاسبه زمان...</div>

    <a href="#" class="btn">بازگشت به صفحه اصلی</a>

</div>

<script>
const targetDate = new Date("2027-03-21T00:00:00").getTime();

function updateCountdown(){
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.getElementById("countdown").innerHTML = "🎉 آماده افتتاح شد!";
        return;
    }

    const days = Math.floor(distance / (1000*60*60*24));
    const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById("countdown").innerHTML =
    `⏳ تا افتتاح: ${days} روز ${hours} ساعت ${minutes} دقیقه ${seconds} ثانیه`;
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>

</body>
</html>
